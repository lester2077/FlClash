name: Sync all upstream branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-upstream.yaml
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-all-upstream-branches
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_id == '1465058140' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mirror upstream source without importing upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/flclash-sync"
          cd "$RUNNER_TEMP/flclash-sync"
          git init --quiet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git remote add upstream "$GITHUB_SERVER_URL/chen08209/FlClash.git"
          for remote in upstream origin; do
            git fetch --quiet --no-tags --no-recurse-submodules "$remote" "+refs/heads/*:refs/remotes/$remote/*"
          done
          python3 - <<'PY'
          import os
          import subprocess

          workflow = '.github/workflows/sync-upstream.yaml'
          target_branches = ('main', 'dev', 'rs')

          def git(*args, data=None):
              return subprocess.run(
                  ['git', *args], input=data, stdout=subprocess.PIPE, check=True,
              ).stdout

          def branches(remote):
              return dict(
                  line.split(' ', 1)
                  for line in git('for-each-ref', '--format=%(refname:lstrip=3) %(objectname)',
                                  f'refs/remotes/{remote}/').decode().splitlines()
              )

          def sync(branch, upstream, current):
              git('read-tree', upstream)
              paths = git('ls-files', '-z', '--', '.github/workflows')
              if paths:
                  git('update-index', '--force-remove', '-z', '--stdin', data=paths)
              if branch == 'main':
                  mode, _, blob = workflow_entry.split('\t', 1)[0].split()
                  git('update-index', '--add', '--cacheinfo', f'{mode},{blob},{workflow}')
              tree = git('write-tree').decode().strip()
              if current and tree == git('rev-parse', f'{current}^{{tree}}').decode().strip():
                  return 'Already up to date'

              message = f'chore: sync upstream {branch}\n\nFlClash-Upstream: {upstream}'
              parents = ['-p', current] if current else []
              updated = git('commit-tree', tree, *parents, '-m', message).decode().strip()
              git('-c', 'credential.helper=!gh auth git-credential', 'push', 'origin',
                  f'{updated}:refs/heads/{branch}')
              return f'Mirrored upstream {upstream[:12]}'

          fork_heads = branches('origin')
          upstream_heads = branches('upstream')
          missing = [branch for branch in target_branches if branch not in upstream_heads]
          if missing:
              raise SystemExit(f'Missing upstream branches: {", ".join(missing)}')
          workflow_entry = git('ls-tree', fork_heads['main'], '--', workflow).decode().strip()
          if not workflow_entry:
              raise SystemExit('The fork main branch is missing its sync workflow')

          results = []
          failed = False
          for branch in target_branches:
              try:
                  result = sync(branch, upstream_heads[branch], fork_heads.get(branch))
              except subprocess.CalledProcessError as error:
                  result = f'Failed: {error}'
                  failed = True
              line = f'{branch}: {result}'
              results.append(line)
              print(line, flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(f'- {line}' for line in results) + '\n')
          raise SystemExit(1 if failed else 0)
          PY
