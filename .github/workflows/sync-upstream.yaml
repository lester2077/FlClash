name: Sync all upstream branches

on:
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-all-upstream-branches
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_id == '1465058140'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sync source code without importing upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/flclash-sync"
          cd "$RUNNER_TEMP/flclash-sync"
          git init --quiet
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git remote add upstream "$GITHUB_SERVER_URL/chen08209/FlClash.git"
          for remote in upstream origin; do
            git fetch --quiet --no-tags --no-recurse-submodules "$remote" "+refs/heads/*:refs/remotes/$remote/*"
          done
          python3 - <<'PY'
          import os
          import subprocess

          workflow = '.github/workflows/sync-upstream.yaml'

          def git(*args, data=None):
              return subprocess.run(
                  ['git', *args], input=data, stdout=subprocess.PIPE, check=True,
              ).stdout.decode('utf-8').strip()

          def source_tree(commit):
              git('read-tree', commit)
              paths = git('ls-files', '-z', '--', '.github/workflows')
              if paths:
                  git('update-index', '--force-remove', '-z', '--stdin', data=paths.encode())
              return git('write-tree')

          def commit_tree(tree, message, *parents):
              parent_args = [argument for parent in parents for argument in ('-p', parent)]
              return git('commit-tree', tree, *parent_args, '-m', message)

          def branches(remote):
              return dict(
                  line.split(' ', 1)
                  for line in git('for-each-ref', '--format=%(refname:lstrip=3) %(objectname)',
                                  f'refs/remotes/{remote}/').splitlines()
              )

          def sync(branch, upstream, current):
              theirs = source_tree(upstream)
              tree = theirs
              if current:
                  baseline = git('log', '-1', '--first-parent',
                                 '--grep=^FlClash-Upstream: [a-f0-9][a-f0-9]*$',
                                 '--format=%(trailers:key=FlClash-Upstream,valueonly)', current)
                  if not baseline:
                      baseline = git('merge-base', current, upstream)
                  if baseline == upstream:
                      return 'Already up to date'
                  base = source_tree(baseline)
                  ours = source_tree(current)
                  if ours == base:
                      tree = theirs
                  elif theirs == base:
                      tree = ours
                  else:
                      base_commit = commit_tree(base, 'Upstream baseline')
                      ours_commit = commit_tree(ours, 'Fork source', base_commit)
                      theirs_commit = commit_tree(theirs, 'Upstream source', base_commit)
                      tree = git('merge-tree', '--write-tree', ours_commit, theirs_commit)
                  git('read-tree', tree)
                  entry = git('ls-tree', current, '--', workflow)
                  if entry:
                      mode, _, blob = entry.split('\t', 1)[0].split()
                      git('update-index', '--add', '--cacheinfo', f'{mode},{blob},{workflow}')
                  tree = git('write-tree')
                  if tree == git('rev-parse', f'{current}^{{tree}}'):
                      return 'No source changes'

              message = f'chore: sync upstream {branch}\n\nFlClash-Upstream: {upstream}'
              updated = commit_tree(tree, message, *([current] if current else []))
              git('-c', 'credential.helper=!gh auth git-credential', 'push', 'origin',
                  f'{updated}:refs/heads/{branch}')
              return f'Updated to upstream {upstream[:12]}' if current else f'Created from {upstream[:12]}'

          fork_heads = branches('origin')
          upstream_heads = branches('upstream')
          if not upstream_heads:
              raise SystemExit('No upstream branches found')

          results = []
          failed = False
          for branch, upstream in upstream_heads.items():
              try:
                  result = sync(branch, upstream, fork_heads.get(branch))
              except subprocess.CalledProcessError as error:
                  result = f'Failed: git {error.cmd[1]} exited with {error.returncode}'
                  failed = True
              line = f'{branch}: {result}'
              results.append(line)
              print(line, flush=True)

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(f'- {line}' for line in results) + '\n')
          raise SystemExit(1 if failed else 0)
          PY
